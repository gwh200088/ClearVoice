server:
  host: 0.0.0.0
  port: 8000
  root_path: ""
  # 留空表示不鉴权；设置后需在请求头携带 X-API-Key 或 Authorization: Bearer <key>
  api_key: ""
  max_upload_mb: 300
  sync_timeout_s: 900.0
  task_ttl_s: 1800
  max_tasks: 2000

runtime:
  # auto | cpu | cuda | cuda:N
  device: auto
  # 限制本进程可见的 GPU（等价于 CUDA_VISIBLE_DEVICES），留空表示使用全部可见 GPU
  gpu_ids: ""
  # 降噪默认模型：FRCRN_SE_16K | MossFormerGAN_SE_16K | MossFormer2_SE_48K
  model: MossFormerGAN_SE_16K
  # 按输入采样率自动选模型（>=32kHz 用 MossFormer2_SE_48K，否则用 runtime.model）
  auto_select_model: true
  # 模型实例数（每个实例独占一把锁，决定真正可并行的推理路数）
  model_pool_size: 2
  torch_threads: 4
  allow_tf32: true
  preload: true
  # 0 表示沿用模型 yaml 里的默认值；>0 用于降低单段解码长度从而压低显存峰值
  decode_window_s: 0.0
  one_time_decode_length_s: 0.0
  # 0 表示不设置硬上限；>0 时调用 torch.cuda.set_per_process_memory_fraction 兜底
  process_memory_ratio: 0.0
  # ---- 推理加速（仅对 MossFormerGAN_SE_16K 生效）----
  # 模型权重与输入切 FP16(.half())，T4/L4 等显卡吃满 TensorCore，通常快 1.5~2 倍。
  # 若对比原始音频发现可闻噪声/失真差异，可改回 false 用 FP32。
  fp16: true
  # 长音频分段解码时一次 forward 合并的窗口数（默认窗口 10s / 步长 7.5s）。
  # 0 = 关闭（一次只推一段）；越大 GPU 利用率越高、越吃显存，建议 4~8，显存不足会自动退回 1。
  batch_chunks: 8

concurrency:
  max_concurrency: 2
  max_queue_size: 64
  queue_timeout_s: 600.0

resource:
  poll_interval_ms: 200
  gpu:
    enabled: true
    reserve_mb: 512
    per_task_mb: 1024
    max_usage_ratio: 0.90
    # 关键：true 时把 PyTorch 缓存池中"占着但没在用"的显存视为可用（区分显示占用与真实占用）
    count_cached_as_free: true
    empty_cache_when_idle: true
    empty_cache_min_interval_s: 10.0
  cpu:
    enabled: true
    reserve_mb: 1024
    per_task_mb: 1024
    max_usage_ratio: 0.85

denoise:
  auto_detect: true
  # ============ 噪声检测参数（当前按"执法记录仪"场景标定）============
  # 该场景特点：录音长（几十分钟~数小时）、人声稀疏（大段只有环境噪声）、
  #   环境噪声复杂（街道 / 风声 / 车载底噪）、突发噪声多（警笛 / 关门 / 喊叫）。
  # 每个参数"调大 / 调小的影响"见 README §8.4；本场景取值理由见 §8.6，换场景请自行标定。

  # 估算 SNR 低于该值才降噪，否则原样返回。
  #   调大 → 更多音频进模型（更彻底、更慢）
  #   调小 → 只有很脏的才处理（更快，但中等噪声会漏处理）
  # 户外环境本底噪声高、SNR 天然低于安静室内，故取 22（略低于通用默认 25），
  # 让相对干净的片段跳过以省算力；上线前建议从服务日志收集一批降噪请求的 snr_db 分布再定（见 README §8.6）。
  snr_threshold_db: 22.0

  # 用"功率最低的 N% 帧"估噪声底。
  #   调大 → 混入更多中等功率帧 → 噪声底偏高 → SNR 偏低 → 更倾向降噪（保守，不易漏）
  #   调小 → 只取最安静的帧 → 噪声底更纯 → SNR 偏高 → 更倾向跳过（激进，可能漏处理）
  # 人声稀疏时静音段充裕，8% 既有足够样本帧又能拿到更干净的噪声底；低于 3 会因样本太少而抖动。
  noise_percentile: 8.0

  # 用"功率最高的 (100-N)% 帧"估语音电平。
  #   调大 → 只取极少数峰值帧 → 易被警笛 / 关门 / 喊叫等突发噪声顶高
  #          → SNR 偏高 → 脏音频被误判成"干净"而跳过（本场景最危险的方向）
  #   调小 → 取更多高能帧做平均 → 削弱突发噪声影响 → SNR 偏低 → 更倾向降噪
  # 从通用默认 90 降到 85，就是为了削弱执法现场突发噪声的影响。
  speech_percentile: 85.0

  # 检测分帧长度（毫秒）。
  #   调大 → 时域分辨率降低、短促语音被平滑 → 语音与噪声差异变小 → SNR 偏低 → 更倾向降噪
  #   调小 → 更精细、能捕捉短促人声，但对瞬态噪声更敏感
  # 20ms 是语音分析的标准值，执法场景无需改动。
  frame_ms: 20.0

  # 检测最多分析的秒数（从头 / 中 / 尾各取 1/3），0 表示分析整段。
  #   【本场景最关键的一项】录音动辄 1~2 小时且人声零星分布，
  #   默认的 45s 极易抽到整段无人声，从而把"有零星对话"的录音误判为无人声而跳过。
  #   180 = 头 / 中 / 尾各 60s；要求绝对准确可设 0（分析整段，耗时随长度增加，仍只是 CPU 解码）。
  analyze_max_seconds: 180.0

  # 语音帧占比低于该值判"没人说话"，整段跳过降噪。
  #   调大 → 更多纯噪声段被跳过（省算力），但可能跳过有价值的短对话
  #   调小 → 更保守，几乎不跳过
  # 执法场景一两句话可能就是关键证据，通用的 1% 对长音频偏严，放宽到 0.5%。
  min_speech_ratio: 0.005

  # 短于该时长直接跳过
  min_duration_s: 0.2
  # 输出码率，如 128k；留空表示跟随输入码率（探测不到时 mp3/m4a 兜底 128k）
  bitrate: ""
  # 输出采样率，0 表示跟随输入
  sample_rate: 0
  # 输出声道数，0 表示跟随输入；1/2 强制单/双声道
  channels: 0

audio:
  allowed_formats: [mp3, wav, m4a]
  temp_dir: /tmp/clearvoice
  probe_timeout_s: 20.0
  encode_timeout_s: 300.0
  decode_timeout_s: 120.0

models:
  root: /opt/models/ClearerVoice-Studio
  # 容器内一般离线运行，找不到权重直接报错而不会去 HuggingFace 下载
  allow_download: false

logging:
  dir: /var/log/clearvoice
  level: INFO
  console: true
  max_bytes: 52428800
  backup_count: 10
  encoding: utf-8
  fmt: "%(asctime)s | %(levelname)-8s | rid=%(request_id)s | %(name)-26s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  access_log: true
  uvicorn_level: INFO
  # 把第三方库/uvicorn 打到 stdout、stderr 的内容也收进日志文件
  capture_stdio: true
